<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="topFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#dbeafe" />
    </linearGradient>
    <linearGradient id="leftFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="rightFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#bfdbfe" />
      <stop offset="100%" stop-color="#93c5fd" />
    </linearGradient>
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-opacity="0.25" flood-color="#0f172a" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  
  <!-- Subtle Border Highlight -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Isometric Package Icon with Shadow -->
  <g filter="url(#dropShadow)">
    <!-- Top Face -->
    <polygon points="32,15 48,23 32,31 16,23" fill="url(#topFace)" />
    
    <!-- Left Face -->
    <polygon points="16,23 32,31 32,49 16,41" fill="url(#leftFace)" />
    
    <!-- Right Face -->
    <polygon points="32,31 48,23 48,41 32,49" fill="url(#rightFace)" />

    <!-- Center Seam & Details -->
    <path d="M32 31 L32 49" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" />
    <path d="M24 19 L40 27" stroke="#2563eb" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6" />
  </g>
</svg>
